name: Curtain
products:
  - id: jajzq6xzk6r2etxg
    manufacturer: A-OK
    model: AM75
entities:
  - entity: cover
    class: curtain
    dps:
      - id: 1
        name: control
        type: string
        optional: true
        mapping:
          - dps_val: open
            value: open
          - dps_val: close
            value: close
          - dps_val: stop
            value: stop
      - id: 2
        name: position
        type: integer
        optional: true
        range:
          min: 0
          max: 100
        mapping:
          - invert: true
      - id: 3
        name: current_position
        type: integer
        optional: true
        range:
          min: 0
          max: 100
        mapping:
          - invert: true
      - id: 7
        name: action
        type: string
        optional: true
        persist: false
        mapping:
          - dps_val: opening
            value: opening
          - dps_val: closing
            value: closing
  - entity: switch
    name: Reverse
    category: config
    icon: "mdi:arrow-u-down-left"
    hidden: unavailable
    dps:
      - id: 5
        type: string
        name: switch
        optional: true
        mapping:
          - dps_val: back
            value: true
          - dps_val: forward
            value: false
      - id: 5
        type: string
        optional: true
        name: available
        mapping:
          - dps_val: null
            value: false
          - value: true
  - entity: switch
    name: Auto power
    category: config
    icon: "mdi:flash-auto"
    dps:
      - id: 6
        type: boolean
        name: switch
        optional: true
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 12
        type: bitfield
        name: sensor
        optional: true
        persist: false
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 12
        name: fault_code
        type: bitfield
        optional: true
