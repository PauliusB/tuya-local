name: Towel rack
products:
  - id: tahwtv6icpeyn6yh
    manufacturer: Mexen
    model: FA-F
entities:
  - entity: climate
    translation_key: heater
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 16
        type: integer
        name: temperature
        unit: C
        range:
          min: 30
          max: 70
      - id: 24
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
  - entity: select
    translation_key: mode
    dps:
      - id: 2
        type: string
        name: option
        mapping:
          - dps_val: hot
            value: Free mode
          - dps_val: eco
            value: Timer mode
          - dps_val: cold
            value: Program mode
          - dps_val: auto
            value: Eco mode
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -5
          max: 5
  - entity: number
    translation_key: timer
    class: duration
    category: config
    dps:
      - id: 111
        type: integer
        name: value
        unit: h
        range:
          min: 10
          max: 240
        mapping:
          - scale: 10
            step: 5
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 40
        type: boolean
        name: lock
  - entity: text
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 110
        type: base64
        optional: true
        name: value
